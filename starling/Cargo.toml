[package]
name = "starlingmonkey"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

# The wasm artifact. The `cdylib` link pulls in no `crt1-command.o`, so the `export!` in `lib.rs`
# is the only `wasi:cli/run` in the module. The binary below does link it, and on wasm32-wasip3
# the `wasi:cli/run@0.3.0#run` it exports collides with that one. The two targets must also differ
# in name, or both would write `starling.wasm`.
[lib]
name = "starling"
crate-type = ["cdylib"]
# The wasm entry point, not a library with tests. A test harness is a binary, so it does not
# receive the `--wrap` link argument `build.rs` emits for the cdylib, and its link fails on an
# undefined `__real___wasm_call_ctors`.
test = false

[[bin]]
name = "starlingmonkey"
path = "src/main.rs"
test = false

[features]
debugmozjs = ['libstarling/debugmozjs']
profilemozjs = ['js/profilemozjs']
jitspew = ['js/jitspew']
intl = ['js/intl']
# Route Rust's allocations through wasi-libc's `malloc`, the allocator SpiderMonkey uses, so
# both sides allocate from one heap.
libc-alloc = ['dep:libc']

[dependencies]
# `core-runtime` and `js` carry no direct use in `lib.rs` or `main.rs`: the former is needed by the
# `examples/` (whose `#[jsmodule]` expansions name it), the latter backs the
# `profilemozjs`/`jitspew`/`intl` features above.
core-runtime.workspace = true
js.workspace = true
libstarling.workspace = true
wasip3.workspace = true
# Pinned to the version `wasip3` itself uses, rather than the workspace's, so the component
# carries one wit-bindgen. Each version generates its own `run_ctors_once` guard, and
# `__wrap___wasm_call_ctors` in `lib.rs` collapses those onto one, so the C++ constructors run
# once. SpiderMonkey's `InitializeUptime` asserts it is called once.
#
# `inter-task-wakeup` lets one wit task wake another through plain Rust wakers, which the serve
# path needs: the response-body writer task parks on a Rust channel the request's event-loop
# drain task feeds (and the drain's body-done signal crosses back the other way). Without it the
# executor panics the moment such a task is the only thing left to sleep on — any long-lived
# streamed response (server-sent events, say) hit that.
wit-bindgen = { workspace = true, features = ["macros", "inter-task-wakeup"] }
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
component-model.workspace = true
web-fetch.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
