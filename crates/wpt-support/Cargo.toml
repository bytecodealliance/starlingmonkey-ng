[package]
name = "wpt-support"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
# No unit tests. This skips building the (SpiderMonkey-sized) lib test harness binary.
test = false

[dependencies]
core-runtime.workspace = true
js.workspace = true
url.workspace = true
web-globals.workspace = true

[dev-dependencies]
# Only the integration tests need the full runtime. A regular dependency would be a cycle:
# `libstarling` registers these globals for `--wpt-mode`. Cargo allows the dev-dependency cycle.
libstarling.workspace = true

[lints]
workspace = true
