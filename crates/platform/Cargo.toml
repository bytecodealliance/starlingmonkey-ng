[package]
name = "platform"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
# No unit tests. This skips building the (SpiderMonkey-sized) lib test harness binary.
test = false

[dependencies]
bytes.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
reqwest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
http.workspace = true
url.workspace = true

[target.'cfg(target_env = "p2")'.dependencies]
async-task.workspace = true
wasip2.workspace = true

[target.'cfg(target_env = "p3")'.dependencies]
wasip3.workspace = true
wit-bindgen = { workspace = true, features = ["async"] }

[lints]
workspace = true
