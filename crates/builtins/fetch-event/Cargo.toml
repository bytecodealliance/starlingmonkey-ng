web-fetch.workspace = true
web-globals.workspace = true

[dev-dependencies]
futures-lite.workspace = true
libstarling.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
