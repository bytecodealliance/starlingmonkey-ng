[package]
name = "js"
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
# No unit tests; skip building the (SpiderMonkey-sized) lib test harness binary.
test = false

[features]
crown = ['mozjs/crown']
debugmozjs = ['mozjs/debugmozjs']
jitspew = ['mozjs/jitspew']
profilemozjs = ['mozjs/profilemozjs']
intl = ['mozjs/intl']

[lints]
workspace = true

[dependencies]
encoding_rs.workspace = true
indexmap = "2.13"
# `libz-rs` (pure Rust) rather than mozjs's default `libz-sys`, whose C zlib has no
# wasm32-wasip3 build. `jit` and `intl` are mozjs defaults that `default-features = false` would
# otherwise drop, and dropping `intl` would take ICU out of every build.
mozjs = { git = "https://github.com/tschneidereit/mozjs.git", branch = "main", default-features = false, features = [
  "jit",
  "libz-rs",
  "intl",
] }
mozjs_sys = { git = "https://github.com/tschneidereit/mozjs.git", branch = "main" }
num-traits = "0.2"
rustc-hash = "2.1"
slab.workspace = true
smallvec.workspace = true
starling-macro.workspace = true
