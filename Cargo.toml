[workspace.package]
version = "0.3.0"
repository = "https://github.com/bytecodealliance/starlingmonkey"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["The StarlingMonkey project contributors"]
edition = "2021"

[workspace]
members = [
    "starling",
    "crates/component-model",
    "crates/compression",
    "crates/dap-relay",
    "crates/debugger",
    "crates/platform",
    "crates/builtins/*",
]
default-members = ["starling"]
exclude = ["crown"]

resolver = "2"

[workspace.dependencies]
bitflags = "2"
brotli = { version = "8", default-features = false, features = ["std"] }
bytes = "1"
clap = { version = "4.5.60", features = ["derive"] }
crc32fast = "1.5"
component-model = { path = "crates/component-model" }
compression = { path = "crates/compression" }
core-runtime = { path = "crates/core-runtime" }
data-url = "0.3"
digest = { version = "0.11", features = ["alloc"] }
debugger = { path = "crates/debugger" }
encoding_rs = "0.8"
event-listener = "5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
form_urlencoded = "1.2"
futures-channel = "0.3"
futures-lite = "2"
futures-util = "0.3"
getrandom = "0.4"
hdrhistogram = { version = "7.5", default-features = false }
heck = "0.5"
hickory-proto = { version = "0.26", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1.10"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
idna = "1.1"
js = { path = "crates/js" }
libm = "0.2"
libstarling = { path = "crates/libstarling" }
md-5 = "0.11"
memchr = "2.7"
oxc_resolver = "11"
percent-encoding = "2"
platform = { path = "crates/platform" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
ripemd = "0.2"
ruzstd = "0.9"
# Native TLS uses aws-lc-rs, the provider reqwest already builds. See `platform::tls`.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
serve-test-support = { path = "crates/serve-test-support" }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.11"
smallvec = "1.16"
starling-macro = { path = "crates/starling-macro" }
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5.8"
urlpattern = "0.6"
wasip3 = { version = "0.9.0", features = ["http-compat"] }
webpki-roots = "1"
# Must equal the `wit-bindgen` version `wasip3` depends on. See `starling/Cargo.toml`.
wit-bindgen = { version = "=0.62.0", features = ["macros"] }
wpt-support = { path = "crates/wpt-support" }

# Builtins
fetch-event = { path = "crates/builtins/fetch-event" }
web-compression = { path = "crates/builtins/web-compression" }
web-encoding-streams = { path = "crates/builtins/web-encoding-streams" }
web-fetch = { path = "crates/builtins/web-fetch" }
web-files = { path = "crates/builtins/web-files" }
web-globals = { path = "crates/builtins/web-globals" }
web-streams = { path = "crates/builtins/web-streams" }
web-url = { path = "crates/builtins/web-url" }
web-websocket = { path = "crates/builtins/web-websocket" }
cpp-builtins = { path = "crates/builtins/cpp-builtins" }

# `block_on_detached` for the debugger's pause on wasm. The fork is wit-bindgen 0.62.0 plus that
# function. Replace the path with a git dependency on the pushed branch before merging.
[patch.crates-io]
wit-bindgen = { path = "../wit-bindgen-block-on/crates/guest-rust" }

# The mozjs fork's `starling-glue` branch: private name symbols, objects created with their
# properties' slot capacity, and a settable WASI recursion depth limit. The prebuilt engine
# archives don't contain these yet, so `.cargo/config.toml` builds SpiderMonkey from source.
# Replace the paths with the git dependency once the branch is merged and its archives are
# published.
[patch."https://github.com/tschneidereit/mozjs.git"]
mozjs = { path = "../../mozjs/mozjs" }
mozjs_sys = { path = "../../mozjs/mozjs-sys" }
mozjs_collator_glue = { path = "../../mozjs/mozjs-extracted-crates/collator_glue" }
mozjs_icu_collator = { path = "../../mozjs/mozjs-extracted-crates/icu_collator" }
mozjs_icu_collections = { path = "../../mozjs/mozjs-extracted-crates/icu_collections" }
mozjs_icu_normalizer = { path = "../../mozjs/mozjs-extracted-crates/icu_normalizer" }
mozjs_icu_provider_glue = { path = "../../mozjs/mozjs-extracted-crates/icu_provider_glue" }
mozjs_locale_glue = { path = "../../mozjs/mozjs-extracted-crates/locale_glue" }
mozjs_normalizer_glue = { path = "../../mozjs/mozjs-extracted-crates/normalizer_glue" }
mozjs_properties_glue = { path = "../../mozjs/mozjs-extracted-crates/properties_glue" }
mozjs_unicode_bidi_ffi = { path = "../../mozjs/mozjs-extracted-crates/unicode_bidi_ffi" }
mozjs_utf16_iter = { path = "../../mozjs/mozjs-extracted-crates/utf16_iter" }
mozjs_utf8_iter = { path = "../../mozjs/mozjs-extracted-crates/utf8_iter" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.test-release]
inherits = "release"
lto = false

[profile.dev]
lto = false

# `mozjs_sys` picks its prebuilt `debugmozjs` archive by opt-level, and only `-O3` archives are
# published. Any other level falls back to building SpiderMonkey from source.
[profile.dev.package.mozjs_sys]
opt-level = 3

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)'] }

[workspace.lints.clippy]
too_many_arguments = "allow"
