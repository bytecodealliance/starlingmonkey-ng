[toolchain]
# The 1.100 beta that `STARLING_BETA` in `.github/tool-versions.env` names. 1.100 is the first
# toolchain whose wasm32-wasip3 std crown can check the wasm32-wasip3 build with. Keep the two in
# sync.
channel = "beta-2026-10-18"

components = [
    "clippy",
    # For support/crown
    "llvm-tools",
    # For support/crown
    "rustc-dev",
    # For formatting
    "rustfmt",
]
targets = [
    "wasm32-wasip2",
    "wasm32-wasip3",
]
profile = "minimal"
