# SPDX-License-Identifier: Apache-2.0-WITH-LLVM-exception

# Release the runtime and `starling-componentize` together, under the workspace's version in the
# repository's `Cargo.toml`, which `componentize/Cargo.toml` repeats. Build the release and debug
# runtimes, `starling-componentize` for every platform of `componentize/npm/platforms.json`, and
# the npm packages `componentize/npm/package.mjs` assembles from them. The assembly fails unless
# the matrix below built a binary for every platform.
#
# A `v<version>` tag, which must name the workspace's version, creates a GitHub release with
# `starling.wasm`, `starling-debug.wasm`, each platform's `starling-componentize` and a
# `SHA256SUMS` file of their digests, and then publishes the npm packages, which download
# `starling-debug.wasm` from the release on first use. A manual run publishes the npm
# packages only with `publish` set, and only if the GitHub release of their version already has
# that `starling-debug.wasm`, and otherwise runs `npm publish --dry-run`. Every run uploads
# the packages' tarballs as the `npm-tarballs` artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to npm, rather than doing a dry run
        type: boolean
        default: false
      version:
        description: >-
          The npm packages' version, such as 0.3.0-preview.1. Defaults to the workspace's
          version in Cargo.toml
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The setup action adds the tool versions of `.github/tool-versions.env`.
  RUSTC_WRAPPER: sccache
  CCACHE: sccache
  SCCACHE_GHA_VERSION: 1

jobs:
  runtime:
    name: Build the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags `check-init-wit.sh` compares with.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          target: wasm32-wasip3

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          componentize=$(sed -n 's/^version = "\(.*\)"$/\1/p' componentize/Cargo.toml | head -1)
          if [ "$componentize" != "$version" ]; then
            echo "componentize/Cargo.toml has version $componentize, the workspace $version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not name the workspace's version $version" >&2
            exit 1
          fi
          ./scripts/check-init-wit.sh

      - name: Build the release runtime
        run: just build-runtime

      # Attached to the GitHub release, from which the npm package downloads it on first use. The
      # package records its digest.
      - name: Build the debug runtime
        run: just build-runtime-debug

      # The artifact holds `release/starling.wasm` and `debug/starling.wasm`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime
          path: |
            target/wasm32-wasip3/release/starling.wasm
            target/wasm32-wasip3/debug/starling.wasm
          if-no-files-found: error

  binaries:
    name: Build for ${{ matrix.platform }}
    needs: runtime
    strategy:
      matrix:
        include:
          # The Linux binaries link musl statically, so they run on any Linux distribution,
          # whichever C library it uses.
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: darwin-x64, os: macos-15-intel }
          - { platform: win32-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      # The per-platform builds share no cache with the runtime build.
      RUSTC_WRAPPER: ""
      CCACHE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup show

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: runtime

      - name: Install musl-gcc
        if: matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # TODO: Should we also build a binary with the release runtime embedded
      - name: Build starling-componentize
        working-directory: componentize
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            rustup target add "$TARGET"
            # `musl-gcc` compiles the C dependencies, such as zstd.
            export "CC_${TARGET//-/_}=musl-gcc"
            cargo build --release --locked --bin starling-componentize --target "$TARGET"
            mkdir -p ../target/release
            cp "../target/$TARGET/release/starling-componentize" ../target/release/
          else
            cargo build --release --locked --bin starling-componentize
          fi

      - name: Check the binary runs
        run: |
          exe=target/release/starling-componentize
          if [ "${{ runner.os }}" = Windows ]; then exe="$exe.exe"; fi
          STARLING_RUNTIME=runtime/release/starling.wasm "$exe" --version
          mkdir -p out
          cp "$exe" out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  npm-packages:
    name: Assemble the npm packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the tool versions to the environment
        run: grep -v '^#' .github/tool-versions.env >>"$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: runtime

      - name: Assemble the packages
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          binaries=()
          for dir in binaries/binary-*; do
            platform=${dir#binaries/binary-}
            binaries+=("$platform=$(ls "$dir"/starling-componentize*)")
          done
          node componentize/npm/package.mjs ${INPUT_VERSION:+--version "$INPUT_VERSION"} \
            --out npm --pack npm-tarballs --all-platforms \
            --runtime runtime/release/starling.wasm --debug-runtime runtime/debug/starling.wasm \
            "${binaries[@]}"

      - name: Smoke-test the packages
        run: ./scripts/check-npm-packages.sh npm-tarballs runtime/debug/starling.wasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs/
          if-no-files-found: error

  publish:
    name: Publish the npm packages
    # After the GitHub release on a tag, since the package downloads its debug runtime from it.
    needs: [npm-packages, github-release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For npm's provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the tool versions to the environment
        run: grep -v '^#' .github/tool-versions.env >>"$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs

      # A manual run can name a version without a GitHub release, whose package would then fail
      # to download its debug runtime, so a real publish first checks that the URL the package
      # records serves the runtime with the digest it records.
      - name: Check the debug runtime is downloadable
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          main=$(ls npm-tarballs/*.tgz | grep -Ev -- '-(darwin|linux|win32)-')
          read -r url sha256 < <(tar -xOzf "$main" package/package.json | node -e '
            const { debugRuntime } = JSON.parse(require("fs").readFileSync(0, "utf8")).starlingComponentize;
            console.log(debugRuntime.url, debugRuntime.sha256);
          ')
          if ! curl -fsSL --retry 3 -o debug.wasm "$url"; then
            echo "The package's debug runtime $url is not downloadable. Is there a GitHub release of this version?" >&2
            exit 1
          fi
          actual=$(sha256sum debug.wasm | cut -d' ' -f1)
          if [ "$actual" != "$sha256" ]; then
            echo "The debug runtime at $url has SHA-256 $actual, not $sha256 as the package records" >&2
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dry_run=--dry-run
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ "${{ inputs.publish }}" = true ]; then
            dry_run=
          fi
          # The platform packages go first, so the package depending on them never
          # names an unpublished version.
          for tarball in npm-tarballs/*.tgz; do
            case "$tarball" in
              *-darwin-* | *-linux-* | *-win32-*) npm publish "$tarball" --provenance $dry_run ;;
              *) main=$tarball ;;
            esac
          done
          npm publish "$main" --provenance $dry_run

  github-release:
    name: Create the GitHub release
    if: github.ref_type == 'tag'
    # After the npm packages passed their smoke test, and before they are published.
    needs: npm-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: runtime

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets
          cp runtime/release/starling.wasm assets/starling.wasm
          cp runtime/debug/starling.wasm assets/starling-debug.wasm
          for dir in binaries/binary-*; do
            platform=${dir#binaries/binary-}
            for exe in "$dir"/starling-componentize*; do
              name=$(basename "$exe")
              cp "$exe" "assets/starling-componentize-${platform}${name#starling-componentize}"
            done
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --title "StarlingMonkey $GITHUB_REF_NAME" \
            --generate-notes assets/*
