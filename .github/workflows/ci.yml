# SPDX-License-Identifier: Apache-2.0-WITH-LLVM-exception

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The setup action adds the tool versions of `.github/tool-versions.env`.
  RUSTC_WRAPPER: sccache
  CCACHE: sccache
  # Bump to purge the sccache GHA cache.
  SCCACHE_GHA_VERSION: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and clippy lints.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          target: native

      - name: Check formatting
        run: just fmt-check --all

      - name: Run clippy
        run: just clippy --all

      - name: Run the componentizer's unit tests
        run: just test-componentize-unit

  # ---------------------------------------------------------------------------
  # The `init` interface between the runtime and the componentizer
  # (`starling/wit/init.wit`) changes only with a version not compatible with the latest
  # release's, since the componentizer accepts runtimes with a compatible version.
  # ---------------------------------------------------------------------------
  init-wit:
    name: init.wit versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags the check compares with.
          fetch-depth: 0

      - name: Install wasm-tools
        run: ./.github/actions/setup/install-tool.sh wasm-tools

      - name: Check init.wit's version
        run: ./scripts/check-init-wit.sh

  # ---------------------------------------------------------------------------
  # Cargo tests: {native, wasm32-wasip2, wasm32-wasip3} × {debug+debugmozjs, release}
  # The wasm recipes also run the serve end-to-end suite (`just test-serve-wasm`). The debug wasm
  # jobs first lint the code each wasm target compiles (`just clippy-wasm`).
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.target }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip2, wasm32-wasip3]
        profile: [debug, release]
        include:
          - { target: native, profile: debug, recipe: test }
          - { target: native, profile: release, recipe: test-release }
          - { target: wasm32-wasip2, profile: debug, recipe: test-wasm }
          - { target: wasm32-wasip2, profile: release, recipe: test-wasm-release }
          - { target: wasm32-wasip3, profile: debug, recipe: test-wasm }
          - { target: wasm32-wasip3, profile: release, recipe: test-wasm-release }
    runs-on: ubuntu-latest
    env:
      # Only the wasm recipes read this.
      WASM_TARGET: ${{ matrix.target }}
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Run clippy for the wasm target
        if: matrix.target != 'native' && matrix.profile == 'debug'
        run: just clippy-wasm

      - name: Run tests
        run: just ${{ matrix.recipe }}

      - name: Run example tests
        if: matrix.target != 'native'
        run: just ${{ matrix.recipe }} --examples

  # ---------------------------------------------------------------------------
  # Componentization suites against the debug runtime (`just test-componentize`).
  # That recipe builds the runtime for wasm32-wasip3, the target the componentizer
  # links against, so this job installs beta and a wasi-sdk with a sysroot for it.
  # ---------------------------------------------------------------------------
  componentize:
    name: Componentize
    runs-on: ubuntu-latest
    env:
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          target: wasm32-wasip3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `--tests` includes the `wit_to_ts` suite, which type-checks its output.
      - name: Install the TypeScript compiler
        run: npm ci

      - name: Build the debug runtime and run the componentization suites
        run: just test-componentize

      # Runs scripts and a late-rejecting top level with the debug runtime component itself.
      - name: Run scripts with the runtime component
        run: just test-runtime

      # Snapshots with `wizer-initialize`, including CLI tools whose `run` export a snapshot calls.
      - name: Test Wizer snapshots
        run: WASM_TARGET=p3 just test-wizer

  # ---------------------------------------------------------------------------
  # WPT suite: {native, wasm32-wasip2, wasm32-wasip3}
  # ---------------------------------------------------------------------------
  wpt:
    name: WPT (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip2, wasm32-wasip3]
    runs-on: ubuntu-latest
    env:
      WASM_TARGET: ${{ matrix.target }}
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clone WPT suite
        run: ./scripts/clone-wpt.sh

      - name: Set up WPT suite
        run: cat deps/wpt-hosts | sudo tee -a /etc/hosts

      # The recipes build the runtime before running the harness.
      - name: Run WPT tests
        run: |
          if [[ "${{ matrix.target }}" != "native" ]]; then
            just wpt-test-wasm -v
          else
            just wpt-test -v
          fi

      # The permissive dimension is native-only: the request-restrictions
      # switch gates code shared between the targets.
      - name: Run WPT tests (permissive)
        if: matrix.target == 'native'
        run: just wpt-test-permissive -v

  gc_rooting:
    name: GC Rooting Checks
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `just check-gc` also checks the wasm32-wasip2 build, which needs the target's std and the
      # WASI SDK, and runs crown's own tests.
      - uses: ./.github/actions/setup
        with:
          target: wasm32-wasip2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Crown static analysis
        run: just check-gc

  # ---------------------------------------------------------------------------
  # GC zeal tests of the default `scripts/test-gc-zeal.sh` packages, each shard
  # running every third mode of the full set.
  # ---------------------------------------------------------------------------
  gc_zeal:
    name: GC Zeal (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          target: native

      - name: GC Zeal tests
        run: just gc-zeal --zeal full --shard ${{ matrix.shard }}/3