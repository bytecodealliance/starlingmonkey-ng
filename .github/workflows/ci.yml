name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WASI_SDK_VERSION: "34"
  # The wasmtime CLI the wasm tests run under, the wasm-tools CLI `scripts/build-runtime.sh` wraps
  # the runtime with, and the nightly toolchain wasm32-wasip3 builds use. All are pinned, so a new
  # release changes nothing until these are bumped.
  WASMTIME_VERSION: "49.0.0"
  WASM_TOOLS_VERSION: "1.258.0"
  STARLING_NIGHTLY: nightly-2026-09-24
  RUSTC_WRAPPER: sccache
  CCACHE: sccache
  # Bump to purge the sccache GHA cache.
  SCCACHE_GHA_VERSION: 1

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and clippy lints.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: native

      - name: Check formatting
        run: just fmt-check --all

      - name: Run clippy
        run: just clippy --all

  # ---------------------------------------------------------------------------
  # Cargo tests: {native, wasm32-wasip2, wasm32-wasip3} × {debug+debugmozjs, release}
  # The wasm recipes also run the serve end-to-end suite (`just test-serve-wasm`).
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.target }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip2, wasm32-wasip3]
        profile: [debug, release]
        include:
          - { target: native, profile: debug, recipe: test }
          - { target: native, profile: release, recipe: test-release }
          - { target: wasm32-wasip2, profile: debug, recipe: test-wasm }
          - { target: wasm32-wasip2, profile: release, recipe: test-wasm-release }
          - { target: wasm32-wasip3, profile: debug, recipe: test-wasm }
          - { target: wasm32-wasip3, profile: release, recipe: test-wasm-release }
    runs-on: ubuntu-latest
    env:
      # Only the wasm recipes read this.
      WASM_TARGET: ${{ matrix.target }}
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}

      - name: Run tests
        run: just ${{ matrix.recipe }}

      - name: Run example tests
        if: matrix.target != 'native'
        run: just ${{ matrix.recipe }} --examples

  # ---------------------------------------------------------------------------
  # The static runtime component: scripts and Wizer snapshots run with it. The runtime is built
  # for wasm32-wasip3, so this job installs nightly and a wasi-sdk with a sysroot for it.
  # ---------------------------------------------------------------------------
  runtime:
    name: Runtime component
    runs-on: ubuntu-latest
    env:
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: wasm32-wasip3
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}

      # Runs scripts and a late-rejecting top level with the runtime component itself.
      - name: Run scripts with the runtime component
        run: WASM_TARGET=p3 just test-runtime

      # Snapshots with `wizer-initialize`, including CLI tools whose `run` export a snapshot calls.
      - name: Test Wizer snapshots
        run: WASM_TARGET=p3 just test-wizer

  # ---------------------------------------------------------------------------
  # WPT suite: {native, wasm32-wasip2, wasm32-wasip3}
  # ---------------------------------------------------------------------------
  wpt:
    name: WPT (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip2, wasm32-wasip3]
    runs-on: ubuntu-latest
    env:
      WASM_TARGET: ${{ matrix.target }}
      WASMTIME_BACKTRACE_DETAILS: '1'
      RUST_BACKTRACE: 'full'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Clone WPT suite
        run: ./scripts/clone-wpt.sh

      - name: Set up WPT suite
        run: cat deps/wpt-hosts | sudo tee -a /etc/hosts

      # The recipes build the runtime before running the harness.
      - name: Run WPT tests
        run: |
          if [[ "${{ matrix.target }}" != "native" ]]; then
            just wpt-test-wasm -v
          else
            just wpt-test -v
          fi

      # The permissive dimension is native-only: the request-restrictions
      # switch gates code shared between the targets.
      - name: Run WPT tests (permissive)
        if: matrix.target == 'native'
        run: just wpt-test-permissive -v

  gc_rooting:
    name: GC Rooting Checks
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          target: native

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Crown static analysis
        run: |
          ./scripts/check-crown.sh --workspace --examples

      - name: GC Zeal tests
        run: just gc-zeal --zeal full --examples --workspace