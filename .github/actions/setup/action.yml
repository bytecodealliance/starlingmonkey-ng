name: Setup build environment
description: Install system deps, Rust toolchain, WASI SDK, wasmtime, wasm-tools, and configure sccache.

inputs:
  target:
    description: 'Build target: "native", "wasm32-wasip2" or "wasm32-wasip3"'
    required: true
  wasi-sdk-version:
    description: Major version of the WASI SDK to install. wasm32-wasip3 needs 34 or later,
      the first with a sysroot for it.
    required: false
    default: "34"

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 m4 libclang-dev llvm

    - name: Install just
      shell: bash
      run: |
        mkdir -p "$HOME/.just/bin"
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
          | bash -s -- --to "$HOME/.just/bin"
        echo "$HOME/.just/bin" >> "$GITHUB_PATH"

    - name: Install Rust toolchain
      shell: bash
      run: rustup show

    - name: Add wasm32-wasip2 target
      if: inputs.target == 'wasm32-wasip2'
      shell: bash
      run: rustup target add wasm32-wasip2

    # The pinned toolchain ships no wasm32-wasip3 std, so the justfile builds that target with the
    # nightly toolchain `STARLING_NIGHTLY` names. The pinned toolchain is still needed for the
    # host-side test harnesses.
    - name: Install nightly Rust toolchain with the wasm32-wasip3 target
      if: inputs.target == 'wasm32-wasip3'
      shell: bash
      run: |
        rustup toolchain install "$STARLING_NIGHTLY" --profile minimal --target wasm32-wasip3
        rustc "+$STARLING_NIGHTLY" --version

    - name: Install WASI SDK
      if: inputs.target != 'native'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.wasi-sdk-version }}
      run: |
        sudo mkdir -p /opt/wasi-sdk
        curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${SDK_VERSION}/wasi-sdk-${SDK_VERSION}.0-x86_64-linux.tar.gz" \
          | sudo tar xz --strip-components=1 -C /opt/wasi-sdk
        echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"

    - name: Install wasmtime
      if: inputs.target != 'native'
      shell: bash
      run: |
        curl -sSf https://wasmtime.dev/install.sh | bash -s -- --version "v$WASMTIME_VERSION"
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

    - name: Install wasm-tools
      if: inputs.target != 'native'
      shell: bash
      run: |
        mkdir -p "$HOME/.wasm-tools/bin"
        curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
          | tar xz --strip-components=1 -C "$HOME/.wasm-tools/bin" "wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools"
        echo "$HOME/.wasm-tools/bin" >> "$GITHUB_PATH"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
