name: Setup build environment
description: Install system deps, Rust toolchain, WASI SDK, wasmtime, wasm-tools, and configure sccache.

inputs:
  target:
    description: 'Build target: "native", "wasm32-wasip2" or "wasm32-wasip3"'
    required: true
  wasi-sdk-version:
    description: Major version of the WASI SDK to install. wasm32-wasip3 needs 34 or later,
      the first with a sysroot for it.
    required: false
    default: "34"

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 m4 libclang-dev llvm

    # `install-tool.sh` checks each download's SHA-256 digest.
    - name: Install just
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh just 1.58.0

    - name: Install Rust toolchain
      shell: bash
      run: rustup show

    - name: Add wasm32-wasip2 target
      if: inputs.target == 'wasm32-wasip2'
      shell: bash
      run: rustup target add wasm32-wasip2

    # The pinned toolchain ships no wasm32-wasip3 std, so the justfile builds that target with the
    # nightly toolchain `STARLING_NIGHTLY` names. The pinned toolchain is still needed for the
    # host-side test harnesses.
    - name: Install nightly Rust toolchain with the wasm32-wasip3 target
      if: inputs.target == 'wasm32-wasip3'
      shell: bash
      run: |
        rustup toolchain install "$STARLING_NIGHTLY" --profile minimal --target wasm32-wasip3
        rustc "+$STARLING_NIGHTLY" --version

    - name: Install WASI SDK
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasi-sdk "${{ inputs.wasi-sdk-version }}"

    - name: Install wasmtime
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasmtime "$WASMTIME_VERSION"

    - name: Install wasm-tools
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasm-tools "$WASM_TOOLS_VERSION"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
