name: Setup build environment
description: Install system deps, Rust toolchain, WASI SDK, wasmtime, wasm-tools, and configure sccache.

inputs:
  target:
    description: 'Build target: "native", "wasm32-wasip2" or "wasm32-wasip3"'
    required: true

runs:
  using: composite
  steps:
    - name: Add the tool versions to the environment
      shell: bash
      run: grep -v '^#' "${{ github.action_path }}/../../tool-versions.env" >>"$GITHUB_ENV"

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 m4 libclang-dev llvm

    # `install-tool.sh` checks each download's SHA-256 digest.
    - name: Install just
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh just

    - name: Install Rust toolchain
      shell: bash
      run: rustup show

    - name: Add wasm32-wasip2 target
      if: inputs.target == 'wasm32-wasip2'
      shell: bash
      run: rustup target add wasm32-wasip2

    # The pinned toolchain ships no wasm32-wasip3 std, so the justfile builds that target with the
    # beta toolchain `STARLING_BETA` names. The pinned toolchain is still needed for the
    # host-side test harnesses.
    - name: Install beta Rust toolchain with the wasm32-wasip3 target
      if: inputs.target == 'wasm32-wasip3'
      shell: bash
      run: |
        rustup toolchain install "$STARLING_BETA" --profile minimal --component clippy \
          --target wasm32-wasip3
        rustc "+$STARLING_BETA" --version

    - name: Install WASI SDK
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasi-sdk

    - name: Install wasmtime
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasmtime

    - name: Install wasm-tools
      if: inputs.target != 'native'
      shell: bash
      run: ${{ github.action_path }}/install-tool.sh wasm-tools

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
